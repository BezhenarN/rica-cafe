services:
  - type: web
    name: rica-backend
    env: docker
    repo: https://github.com/BezhenarN/rica-cafe.git
    branch: main
    region: frankfurt
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: rica-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: "admin@rica.local"
      - key: ADMIN_PASSWORD
        value: "rica123456"
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: rica-db
    databaseName: rica
    plan: free
