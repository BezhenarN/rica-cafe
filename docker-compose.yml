services:
  postgres:
    image: postgres:16-alpine
    container_name: rica-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rica
      POSTGRES_PASSWORD: rica_pass
      POSTGRES_DB: rica
    ports:
      - "5432:5432"
    volumes:
      - rica_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rica -d rica"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: rica-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rica.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  rica_pgdata:
